name: Fechamento Semanal BSC Looker Studio Z-API

on:
  schedule:
    # Executa automaticamente toda quarta-feira às 08:00 da manhã (horário de Brasília = 11:00 UTC)
    - cron: '0 11 * * 3'
  workflow_dispatch:

jobs:
  analise-fechamento:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias do projeto
        run: npm ci || npm install

      - name: Instalar navegador Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Agente de Fechamento Semanal (4 Paginas) e enviar no Grupo via Z-API
        env:
          CI: 'true'
          TZ: 'America/Sao_Paulo'
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASSWORD: ${{ secrets.GOOGLE_PASSWORD }}
          GOOGLE_STORAGE_STATE_BASE64: ${{ secrets.GOOGLE_STORAGE_STATE_BASE64 }}
          ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          ZAPI_GROUP_ID: ${{ secrets.ZAPI_GROUP_ID }}
          ZAPI_GROUP_NAME: ${{ secrets.ZAPI_GROUP_NAME }}
          ZAPI_TARGET_PHONE: ${{ secrets.ZAPI_TARGET_PHONE }}
        run: npm run analyze

      - name: Salvar relatorio gerado nos artefatos da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-fechamento-semanal
          path: |
            relatorios/
            dados/*.png
          retention-days: 30
